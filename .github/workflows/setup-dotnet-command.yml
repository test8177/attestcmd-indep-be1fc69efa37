name: attest command containment
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  id-token: write
  attestations: write
  statuses: write
jobs:
  probe:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out lower tree strictly as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: lower-data
          persist-credentials: false
          set-safe-directory: false
          allow-unsafe-pr-checkout: true
      - id: normal
        name: Normal subject control
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: lower-data/normal.config
          predicate-type: https://controlled.invalid/attest-command/v1
          predicate: '{"controlled":true,"kind":"normal"}'
          show-summary: false
      - id: injected
        name: Lower Git filename subject
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: lower-data/injected/*
          predicate-type: https://controlled.invalid/attest-command/v1
          predicate: '{"controlled":true,"kind":"injected"}'
          show-summary: false
      - name: Fixed owner status sink
        if: steps.injected.outputs.probe == 'ATTESTCMDINDEP-650f06f9b66b51354c9f1f58'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          body = json.dumps({
              'state': 'success',
              'context': 'attest-command-independent-c3c6f2796cdd',
              'description': 'inert actions-attest command containment',
          }, separators=(',', ':')).encode()
          request = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/statuses/' + os.environ['TARGET_SHA'],
              data=body,
              method='POST',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'actions-attest-command-containment',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print('STATUS_SINK ' + json.dumps({'status': response.status}, sort_keys=True))
          PY
      - name: Fixed output oracle
        if: always()
        env:
          NORMAL_PROBE: ${{ steps.normal.outputs.probe }}
          INJECTED_PROBE: ${{ steps.injected.outputs.probe }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          normal = os.environ.get('NORMAL_PROBE', '')
          injected = os.environ.get('INJECTED_PROBE', '')
          result = {
              'normal_probe_empty': normal == '',
              'normal_gate_false': normal != 'ATTESTCMDINDEP-650f06f9b66b51354c9f1f58',
              'injected_probe_exact': hashlib.sha256(injected.encode()).hexdigest() == '2e7c518e441902c0fbfb883675d5ffc65b98bf93d3ac5eb7c7976db5ac3e797f' and len(injected) == 39,
              'injected_probe_sha256': hashlib.sha256(injected.encode()).hexdigest(),
              'injected_probe_length': len(injected),
          }
          print('ATTEST_COMMAND_ORACLE ' + json.dumps(result, sort_keys=True, separators=(',', ':')))
          PY
